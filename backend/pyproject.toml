[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprichblitz-backend"
version = "0.1.0"
description = "Sprichblitz – FastAPI backend for personal dictation tool"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sprichblitz contributors" }]

dependencies = [
    "fastapi>=0.139.2,<0.140",
    "uvicorn[standard]>=0.51.0,<0.52",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "PyYAML>=6.0,<7.0",
    "loguru>=0.7,<0.8",
    "python-multipart>=0.0.20,<0.1",
    "tenacity>=9.0,<10.0",
    "httpx>=0.28,<0.30",
    "pydub>=0.25,<0.26",
    "scipy>=1.14,<2.0",
    "numpy>=1.26,<3.0",
    "python-dotenv>=1.0,<2.0",
    "anthropic>=0.117.0,<1.0",
    "google-genai>=2.12.1,<3.0",
    # Multiuser-Persistenz, Migrationen & Key-Vault (Etappe 1+2)
    "sqlmodel>=0.0.22,<0.1",
    "alembic>=1.14,<2.0",
    "cryptography>=49.0.0,<50",
    # Cloudflare-Access-JWT-Validierung (Etappe 6); nutzt das vorhandene cryptography.
    "pyjwt[crypto]>=2.13.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.4.0,<1.5",
    "respx>=0.21,<0.30",
    "ruff>=0.15.22,<1.0",
]

[project.scripts]
sprichblitz-backend = "sprichblitz_backend.__main__:main"
sprichblitz-backend-setup = "sprichblitz_backend.setup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Statische Konsolen-Assets (c2) müssen ins Wheel – sonst bricht der /app-Mount
# in einem Nicht-Editable-Build (StaticFiles findet das Verzeichnis nicht).
sprichblitz_backend = ["console_static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
